<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>RubySDL 项目导航</title>
<style>
:root{--blue:#1a3a6b;--gold:#c9a84c;--green:#27ae60;--gray:#f4f6f9;--border:#dde3ed;--text:#2c3e50}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--gray);color:var(--text);min-height:100vh}
header{background:linear-gradient(135deg,var(--blue),#2c5282);color:#fff;padding:48px 24px;text-align:center}
header h1{font-size:2rem;font-weight:700;margin-bottom:8px}
header p{opacity:.8;font-size:1rem}
.container{max-width:860px;margin:0 auto;padding:40px 16px 60px}
.projects{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:560px){.projects{grid-template-columns:1fr}}
.project-card{background:#fff;border-radius:14px;border:1px solid var(--border);overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.06);transition:.2s}
.project-card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.1)}
.card-header{padding:22px 24px 16px;border-bottom:1px solid var(--border)}
.card-icon{font-size:2rem;margin-bottom:10px}
.card-title{font-size:1.1rem;font-weight:700;color:var(--blue);margin-bottom:6px}
.card-desc{font-size:.85rem;color:#666;line-height:1.6}
.card-links{padding:16px 24px;display:flex;flex-direction:column;gap:8px}
.link-btn{display:block;padding:9px 16px;border-radius:8px;text-decoration:none;font-size:.88rem;font-weight:600;text-align:center;transition:.2s}
.link-primary{background:var(--blue);color:#fff}.link-primary:hover{background:#2c5282}
.link-secondary{background:var(--gray);color:var(--blue);border:1px solid var(--border)}.link-secondary:hover{background:#e8edf5}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.72rem;font-weight:700;margin-left:6px;vertical-align:middle}
.tag-new{background:#d4edda;color:#155724}
footer{text-align:center;color:#aaa;font-size:.8rem;padding:24px;border-top:1px solid var(--border);background:#fff}
</style>
</head>
<body>
<header>
  <h1>🗂 RubySDL 项目中心</h1>
  <p>用户调研系统 & 欧洲出差指南</p>
</header>
<div class="container">
  <div class="projects">
    <div class="project-card">
      <div class="card-header">
        <div class="card-icon">📋</div>
        <div class="card-title">用户调研系统 <span class="tag tag-new">主项目</span></div>
        <div class="card-desc">法国旅游产品用户访谈工具。包含基础问卷录入（PDF结构）与深度访谈记录（中/英/法三语言），数据统计看板，支持 CSV/JSON 导出。</div>
      </div>
      <div class="card-links">
        <a href="survey/interview.html" class="link-btn link-primary">📝 填写问卷 / 访谈记录</a>
        <a href="survey/dashboard.html" class="link-btn link-secondary">📊 查看记录看板</a>
        <a href="survey/workflow.html" class="link-btn link-secondary">🔄 调研工作流</a>
      </div>
    </div>
    <div class="project-card">
      <div class="card-header">
        <div class="card-icon">🌍</div>
        <div class="card-title">欧洲出差指南</div>
        <div class="card-desc">法国 & 德国短期商务出差实用手册。涵盖出发准备、交通、住宿、餐饮、商务礼仪、注意事项及紧急联系。</div>
      </div>
      <div class="card-links">
        <a href="travel/index.html" class="link-btn link-primary">🗺 查看出差指南</a>
      </div>
    </div>
  </div>
</div>
<footer>RubySDL · GitHub Pages · <a href="https://github.com/RubySDL/RubySDL.github.io" style="color:#aaa">查看源码</a></footer>
</body>
</html>
