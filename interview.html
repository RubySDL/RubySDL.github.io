<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>用户访谈问卷 | Interview Questionnaire</title>
<style>
:root{
  --blue:#1a3a6b;--light:#4a7bc8;--gold:#c9a84c;--red:#c0392b;--green:#27ae60;
  --gray:#f4f6f9;--text:#2c3e50;--border:#dde3ed;--hint:#7f8c9a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--gray);color:var(--text);line-height:1.7}
header{background:linear-gradient(135deg,var(--blue),#2c5282);color:#fff;padding:32px 24px;text-align:center}
header h1{font-size:1.8rem;font-weight:700;margin-bottom:6px}
header p{opacity:.85;font-size:.95rem}
.lang-bar{background:#fff;border-bottom:2px solid var(--border);display:flex;justify-content:center;gap:0;padding:0;box-shadow:0 2px 6px rgba(0,0,0,.06);position:sticky;top:0;z-index:200}
.lang-btn{padding:14px 24px;border:none;background:none;color:var(--blue);font-weight:700;font-size:.95rem;cursor:pointer;border-bottom:3px solid transparent;transition:.2s}
.lang-btn.active{border-bottom-color:var(--gold);color:var(--gold)}
.container{max-width:860px;margin:0 auto;padding:24px 16px 80px}

/* meta card */
.meta-card{background:#fff;border-radius:12px;padding:24px;border:1px solid var(--border);margin-bottom:24px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.meta-card h3{color:var(--blue);font-size:1rem;margin-bottom:14px;font-weight:700}
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:540px){.meta-grid{grid-template-columns:1fr}}
.field label{display:block;font-size:.82rem;font-weight:600;color:var(--hint);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:9px 12px;font-size:.93rem;color:var(--text);background:#fafbfc;transition:.2s;font-family:inherit}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--light);background:#fff}

/* section */
.section{margin-bottom:20px}
.section-header{background:var(--blue);color:#fff;border-radius:10px 10px 0 0;padding:14px 20px;display:flex;align-items:center;gap:10px}
.section-header .snum{background:rgba(255,255,255,.2);border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem;flex-shrink:0}
.section-header h2{font-size:1rem;font-weight:700}
.section-header .time{margin-left:auto;opacity:.75;font-size:.82rem;white-space:nowrap}
.section-body{background:#fff;border:1px solid var(--border);border-top:none;border-radius:0 0 10px 10px;overflow:hidden}

/* question */
.q-item{border-bottom:1px solid var(--border);padding:20px}
.q-item:last-child{border-bottom:none}
.q-main{font-weight:600;font-size:.97rem;color:var(--text);margin-bottom:10px}
.q-hints{background:#f0f4ff;border-radius:8px;padding:12px 16px;margin-bottom:12px;font-size:.83rem;color:#4a5568;border-left:3px solid var(--light)}
.q-hints summary{cursor:pointer;font-weight:600;color:var(--light);font-size:.83rem;user-select:none}
.q-hints summary::marker{color:var(--light)}
.hints-list{margin-top:8px;padding-left:16px}
.hints-list li{margin-bottom:4px}
.q-answer{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:10px 14px;font-size:.92rem;resize:vertical;min-height:90px;font-family:inherit;color:var(--text);background:#fafbfc;transition:.2s}
.q-answer:focus{outline:none;border-color:var(--light);background:#fff}
.q-answer::placeholder{color:#b0bec5}

/* bottom bar */
.bottom-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid var(--border);padding:12px 24px;display:flex;gap:12px;justify-content:center;z-index:100;box-shadow:0 -4px 12px rgba(0,0,0,.08)}
.btn{padding:11px 28px;border:none;border-radius:8px;font-size:.95rem;font-weight:700;cursor:pointer;transition:.2s}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:#2c5282}
.btn-secondary{background:#fff;color:var(--blue);border:2px solid var(--blue)}
.btn-secondary:hover{background:var(--gray)}
.btn-success{background:var(--green);color:#fff}
.btn-success:hover{background:#219a52}

/* toast */
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%) translateY(-20px);background:#2c3e50;color:#fff;padding:12px 24px;border-radius:10px;font-size:.93rem;opacity:0;transition:.3s;z-index:999;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* modal */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:14px;padding:32px;max-width:480px;width:90%;text-align:center}
.modal h3{font-size:1.2rem;color:var(--blue);margin-bottom:12px}
.modal p{color:var(--hint);font-size:.93rem;margin-bottom:20px;line-height:1.6}
.modal-btns{display:flex;gap:12px;justify-content:center}
</style>
</head>
<body>

<header>
  <h1>📋 用户访谈问卷</h1>
  <p>User Interview Questionnaire · Questionnaire d'entretien utilisateur</p>
</header>

<div class="lang-bar">
  <button class="lang-btn active" onclick="setLang('zh')">🇨🇳 中文</button>
  <button class="lang-btn" onclick="setLang('en')">🇬🇧 English</button>
  <button class="lang-btn" onclick="setLang('fr')">🇫🇷 Français</button>
</div>

<div class="container">

  <!-- 访谈元信息 -->
  <div class="meta-card">
    <h3 data-zh="📝 访谈基本信息" data-en="📝 Interview Information" data-fr="📝 Informations sur l'entretien">📝 访谈基本信息</h3>
    <div class="meta-grid">
      <div class="field">
        <label data-zh="访谈员姓名" data-en="Interviewer Name" data-fr="Nom de l'intervieweur">访谈员姓名</label>
        <input type="text" id="meta-interviewer" placeholder="请输入..."/>
      </div>
      <div class="field">
        <label data-zh="受访者编号/姓名" data-en="Interviewee ID / Name" data-fr="ID / Nom de l'interviewé">受访者编号/姓名</label>
        <input type="text" id="meta-interviewee" placeholder="U001 / 匿名"/>
      </div>
      <div class="field">
        <label data-zh="访谈日期" data-en="Interview Date" data-fr="Date de l'entretien">访谈日期</label>
        <input type="date" id="meta-date"/>
      </div>
      <div class="field">
        <label data-zh="访谈地点/方式" data-en="Location / Method" data-fr="Lieu / Méthode">访谈地点/方式</label>
        <input type="text" id="meta-location" placeholder="线下 / 线上视频 / 电话"/>
      </div>
      <div class="field">
        <label data-zh="受访者年龄" data-en="Age" data-fr="Âge">受访者年龄</label>
        <input type="text" id="meta-age" placeholder="例：28"/>
      </div>
      <div class="field">
        <label data-zh="受访者职业" data-en="Occupation" data-fr="Profession">受访者职业</label>
        <input type="text" id="meta-job" placeholder="例：产品经理"/>
      </div>
      <div class="field" style="grid-column:1/-1">
        <label data-zh="备注" data-en="Notes" data-fr="Notes">备注</label>
        <textarea id="meta-notes" rows="2" placeholder="其他补充信息..."></textarea>
      </div>
    </div>
  </div>

  <!-- 问卷主体 -->
  <div id="questionnaire"></div>

</div>

<!-- 底部操作栏 -->
<div class="bottom-bar">
  <button class="btn btn-secondary" onclick="clearForm()">🗑 清空</button>
  <button class="btn btn-secondary" onclick="window.open('dashboard.html','_blank')">📊 查看记录</button>
  <button class="btn btn-primary" onclick="saveInterview()">💾 保存记录</button>
  <button class="btn btn-success" onclick="submitInterview()">✅ 提交完成</button>
</div>

<div class="toast" id="toast"></div>

<div class="modal-bg" id="modal">
  <div class="modal">
    <h3 id="modal-title">确认提交</h3>
    <p id="modal-body">确认提交本次访谈记录？提交后将保存至本地并可在"查看记录"中查阅。</p>
    <div class="modal-btns">
      <button class="btn btn-secondary" onclick="closeModal()">取消</button>
      <button class="btn btn-success" onclick="confirmSubmit()">确认提交</button>
    </div>
  </div>
</div>

<script>
// ==================== 问卷数据 ====================
const QUESTIONS = {

// ==================== 状态 ====================
let currentLang = 'zh';

// ==================== 渲染问卷 ====================
function renderQuestionnaire(lang) {
  const sections = QUESTIONS[lang];
  const container = document.getElementById('questionnaire');
  container.innerHTML = '';

  sections.forEach((sec, si) => {
    const div = document.createElement('div');
    div.className = 'section';
    let objHtml = sec.objective ? `<div style="font-size:.82rem;opacity:.75;margin-top:4px">${sec.objective}</div>` : '';
    let qs = sec.questions.map((q, qi) => {
      const mainText = q.main.replace(/\n/g,'<br/>');
      const hintsHtml = q.hints.length ? `
        <details class="q-hints">
          <summary>💡 追问提示 / Follow-up prompts</summary>
          <ul class="hints-list">
            ${q.hints.map(h=>`<li>${h}</li>`).join('')}
          </ul>
        </details>` : '';
      return `
        <div class="q-item">
          <div class="q-main">${si === 0 && qi === 0 ? '' : `Q${qi+1}. `}${mainText}</div>
          ${hintsHtml}
          <textarea class="q-answer" id="ans-${q.id}" placeholder="记录受访者回答..." rows="4"></textarea>
        </div>`;
    }).join('');

    div.innerHTML = `
      <div class="section-header">
        <div class="snum">${si+1}</div>
        <h2>${sec.title}</h2>
        ${sec.time ? `<div class="time">⏱ ${sec.time}</div>` : ''}
      </div>
      ${objHtml}
      <div class="section-body">${qs}</div>`;
    container.appendChild(div);
  });

  // 恢复已填写内容
  restoreAnswers();
}

// ==================== 语言切换 ====================
function setLang(lang) {
  currentLang = lang;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');

  // 切换 label 文字
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = el.dataset[lang] || el.dataset.zh;
  });

  renderQuestionnaire(lang);
}

// ==================== 本地存储 ====================
function getStorageKey() {
  const id = document.getElementById('meta-interviewee').value.trim() || 'draft';
  const date = document.getElementById('meta-date').value || new Date().toISOString().slice(0,10);
  return `interview_${date}_${id}`;
}

function collectData() {
  const answers = {};
  document.querySelectorAll('.q-answer').forEach(el => {
    answers[el.id.replace('ans-','')] = el.value;
  });
  return {
    meta: {
      interviewer: document.getElementById('meta-interviewer').value,
      interviewee: document.getElementById('meta-interviewee').value,
      date: document.getElementById('meta-date').value,
      location: document.getElementById('meta-location').value,
      age: document.getElementById('meta-age').value,
      job: document.getElementById('meta-job').value,
      notes: document.getElementById('meta-notes').value,
      lang: currentLang,
      savedAt: new Date().toISOString()
    },
    answers
  };
}

function restoreAnswers() {
  const key = getStorageKey();
  const saved = localStorage.getItem(key);
  if (!saved) return;
  try {
    const data = JSON.parse(saved);
    if (data.answers) {
      Object.entries(data.answers).forEach(([id, val]) => {
        const el = document.getElementById('ans-' + id);
        if (el) el.value = val;
      });
    }
  } catch(e){}
}

function saveInterview() {
  const data = collectData();
  const key = getStorageKey();
  localStorage.setItem(key, JSON.stringify(data));

  // 存入总列表
  let list = JSON.parse(localStorage.getItem('interview_list') || '[]');
  if (!list.includes(key)) list.push(key);
  localStorage.setItem('interview_list', JSON.stringify(list));

  showToast('✅ 已保存到本地');
}

function submitInterview() {
  document.getElementById('modal').classList.add('open');
}
function closeModal() {
  document.getElementById('modal').classList.remove('open');
}
function confirmSubmit() {
  closeModal();
  saveInterview();

  // 标记为已完成
  const key = getStorageKey();
  const data = JSON.parse(localStorage.getItem(key) || '{}');
  data.meta.submitted = true;
  data.meta.submittedAt = new Date().toISOString();
  localStorage.setItem(key, JSON.stringify(data));

  showToast('🎉 访谈已提交！可在"查看记录"中查阅');
}

function clearForm() {
  if (!confirm('确认清空所有填写内容？')) return;
  document.querySelectorAll('.q-answer').forEach(el => el.value = '');
  ['meta-interviewer','meta-interviewee','meta-date','meta-location','meta-age','meta-job','meta-notes']
    .forEach(id => { const el = document.getElementById(id); if(el) el.value=''; });
  showToast('🗑 已清空');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ==================== 初始化 ====================
document.getElementById('meta-date').value = new Date().toISOString().slice(0,10);
renderQuestionnaire('zh');

// 自动保存（每30秒）
setInterval(saveInterview, 30000);
